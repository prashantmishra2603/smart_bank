version: '3.8'

services:
  db:
    image: postgres:15
    container_name: smartbank_db
    environment:
      POSTGRES_USER: smartbank_user
      POSTGRES_PASSWORD: smartbank_password
      POSTGRES_DB: smartbank_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
